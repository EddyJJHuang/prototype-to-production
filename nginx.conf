server {
    listen 80;
    server_name demo.eddyislearning.ai;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name demo.eddyislearning.ai;

    # SSL certificates (update paths to match your setup)
    # ssl_certificate     /etc/letsencrypt/live/demo.eddyislearning.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/demo.eddyislearning.ai/privkey.pem;

    # ── Frontend: serve the built React app ──────────────────────────────
    root /var/www/visahire/dist;
    index index.html;

    # SPA fallback — all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API proxy ────────────────────────────────────────────────
    # Forward /analyze, /jobs, /health to the FastAPI backend on port 8000
    location /analyze {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resume upload may take time (LLM processing)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Allow large file uploads (resumes up to 10MB)
        client_max_body_size 10M;
    }

    location /jobs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Static assets caching ────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
